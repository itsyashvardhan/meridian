channels:
  - id: general-assistant
    name: General Assistant
    description: Ask for help with everyday work.
    permitted_agents: [general-assistant, release-notes, meeting-follow-ups]
    allowed_groups: [all]
  - id: risk-and-compliance
    name: Risk & Compliance
    description: Investigate policies, transaction monitoring, and control evidence.
    permitted_agents: [knowledge, risk-analyst, expense-review]
    allowed_groups: [risk, compliance]
  - id: company-knowledge
    name: Company Knowledge
    description: Find authorized answers from company documents.
    permitted_agents: [knowledge, research-desk, ticket-triage]
    allowed_groups: [all]
  - id: dev-ops
    name: Developer Operations
    description: Coordinate pull requests, triage issues, and inspect production changes.
    permitted_agents: [general-assistant, release-notes]
    allowed_groups: [all]

